pr_body: "\r\n<!--  Thanks for sending a pull request!  Here are some tips for you:\r\n\r\n1.
  If this is your first time, please read our contributor guidelines: https://git.k8s.io/community/contributors/guide/first-contribution.md#your-first-contribution
  and developer guide https://git.k8s.io/community/contributors/devel/development.md#development-guide\r\n2.
  Please label this pull request according to what type of issue you are addressing,
  especially if this is a release targeted pull request. For reference on required
  PR/issue labels, read here:\r\nhttps://git.k8s.io/community/contributors/devel/sig-release/release.md#issuepr-kind-label\r\n3.
  Ensure you have added or ran the appropriate tests for your PR: https://git.k8s.io/community/contributors/devel/sig-testing/testing.md\r\n4.
  If you want *faster* PR reviews, read how: https://git.k8s.io/community/contributors/guide/pull-requests.md#best-practices-for-faster-reviews\r\n5.
  If the PR is unfinished, see how to mark it: https://git.k8s.io/community/contributors/guide/pull-requests.md#marking-unfinished-pull-requests\r\n-->\r\n\r\n####
  What type of PR is this?\r\n\r\n/kind cleanup deprecation\r\n\r\n<!--\r\nAdd one
  of the following kinds:\r\n/kind bug\r\n/kind dependency\r\n/kind cleanup\r\n/kind
  documentation\r\n/kind feature\r\n\r\nOptionally add one or more of the following
  kinds if applicable:\r\n/kind api-change\r\n/kind deprecation\r\n/kind failing-test\r\n/kind
  flake\r\n/kind regression\r\n-->\r\n\r\n#### What this PR does / why we need it:\r\n\r\nIf
  the user has provided a KubeProxyConfiguration component\r\nconfig with 'mode: ipvs'
  show a warning saying that IPVS\r\nmode has been deprecated since 1.35. Recommend
  'nftables'\r\nwhich has been GA since 1.33, or the legacy 'iptables' on\r\nolder
  kernels.\r\n\r\n#### Which issue(s) this PR is related to:\r\n<!--\r\nPlease link
  relevant issues to help with tracking.\r\n\r\nTo automatically close the linked
  issue(s) when this PR is merged,\r\nadd the word \"Fixes\" before the issue number
  or link.\r\nDo not use \"Fixes\" if the PR is of kind `failing-test` or `flake`.\r\n\r\nReference
  KEPs when applicable in addition to specific issues.\r\n\r\nExamples:\r\nFixes #<issue
  number>\r\n<issue link> (issue in a different repository)\r\nKEP: https://github.com/kubernetes/enhancements/issues/<kep-issue-number>\r\n\r\nIf
  there is no associated issue, then write \"N/A\".\r\n-->\r\n\r\nxref https://github.com/kubernetes/kubeadm/issues/3309\r\n\r\n####
  Special notes for your reviewer:\r\n\r\nNONE\r\n\r\n#### Does this PR introduce
  a user-facing change?\r\n<!--\r\nIf no, just write \"NONE\" in the release-note
  block below.\r\nIf yes, a release note is required:\r\nEnter your extended release
  note in the block below. If the PR requires additional action from users switching
  to the new release, include the string \"action required\".\r\n\r\nFor more information
  on release notes see: https://git.k8s.io/community/contributors/guide/release-notes.md\r\n-->\r\n```release-note\r\nkubeadm:
  added a (delayed) warning that kube-proxy's 'ipvs' mode is deprecated since v1.35
  and users on newer Linux kernels should be using the 'nftables' mode instead, which
  became GA in 1.33. For older kernel versions, users can use 'iptables', which is
  still the default. \r\n```\r\n\r\n#### Additional documentation e.g., KEPs (Kubernetes
  Enhancement Proposals), usage docs, etc.:\r\n\r\n<!--\r\nThis section can be blank
  if this pull request does not require a release note.\r\n\r\nWhen adding links which
  point to resources within git repositories, like\r\nKEPs or supporting documentation,
  please reference a specific commit and avoid\r\nlinking directly to the master branch.
  This ensures that links reference a\r\nspecific point in time, rather than a document
  that may change over time.\r\n\r\nSee here for guidance on getting permanent links
  to files: https://help.github.com/en/articles/getting-permanent-links-to-files\r\n\r\nPlease
  use the following format for linking documentation:\r\n- [KEP]: <link>\r\n- [Usage]:
  <link>\r\n- [Other doc]: <link>\r\n-->\r\n```docs\r\n\r\n```\r\n"
releasenote:
  text: 'Kubeadm: Added a (delayed) warning that kube-proxy''s ''ipvs'' mode is deprecated
    since v1.35 and users on newer Linux kernels should be using the ''nftables''
    mode instead, which became GA in 1.33. For older kernel versions, users can use
    ''iptables'', which is still the default.'
