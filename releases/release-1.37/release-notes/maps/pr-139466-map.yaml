pr: 139466
pr_body: "#### What type of PR is this?\r\n/kind feature\r\n/sig apps\r\n\r\n####
  What this PR does / why we need it:\r\nAfter a bug was discovered with MaxUnavailable
  feature (see https://github.com/kubernetes/kubernetes/issues/137409) we demoted
  the feature back to off in https://github.com/kubernetes/kubernetes/pull/137904.
  \r\n\r\nThe fix landed in 1.37 (see https://github.com/kubernetes/kubernetes/pull/137666),
  so we can now safely bring back the FG to on by default. \r\n\r\n#### Which issue(s)
  this PR is related to:\r\nKEP: https://github.com/kubernetes/enhancements/issues/961\r\n\r\n####
  Special notes for your reviewer:\r\n/assign @helayoty \r\n\r\n#### Does this PR
  introduce a user-facing change?\r\n```release-note\r\nThe MaxUnavailableStatefulSet
  feature is now enabled by default.\r\n```\r\n\r\n#### Additional documentation e.g.,
  KEPs (Kubernetes Enhancement Proposals), usage docs, etc.:\r\n```docs\r\n- KEP:
  https://github.com/kubernetes/enhancements/issues/961\r\n```\r\n"
releasenote:
  text: The `MaxUnavailableStatefulSet` feature is now enabled by default.
