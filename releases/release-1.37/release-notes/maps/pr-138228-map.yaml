pr_body: "#### What type of PR is this?\r\n\r\n/kind bug\r\n\r\n(I assume this is
  a bug? Otherwise I can mark it as cleanup)\r\n\r\n#### What this PR does / why we
  need it:\r\n\r\nAll well-known types should have `metadata.generation` and `status.observedGeneration`.
  HPA doesn't have that.\r\nSome context in this thread: https://kubernetes.slack.com/archives/CJUQN3E4T/p1772897760209959\r\n\r\nIf
  this PR is approved, I'll make an issue to track the feature gate.\r\nI assume the
  next steps for the gate are:\r\n1. n+1 - set to enabled by default\r\n2. n+2 - remove
  gate\r\n\r\n#### Which issue(s) this PR is related to:\r\n<!--\r\nPlease link relevant
  issues to help with tracking.\r\n\r\nTo automatically close the linked issue(s)
  when this PR is merged,\r\nadd the word \"Fixes\" before the issue number or link.\r\nDo
  not use \"Fixes\" if the PR is of kind `failing-test` or `flake`.\r\n\r\nReference
  KEPs when applicable in addition to specific issues.\r\n\r\nExamples:\r\nFixes #<issue
  number>\r\n<issue link> (issue in a different repository)\r\nKEP: https://github.com/kubernetes/enhancements/issues/<kep-issue-number>\r\n\r\nIf
  there is no associated issue, then write \"N/A\".\r\n-->\r\n\r\n#### Special notes
  for your reviewer:\r\n\r\n#### Does this PR introduce a user-facing change?\r\n<!--\r\nIf
  no, just write \"NONE\" in the release-note block below.\r\nIf yes, a release note
  is required:\r\nEnter your extended release note in the block below. If the PR requires
  additional action from users switching to the new release, include the string \"action
  required\".\r\n\r\nFor more information on release notes see: https://git.k8s.io/community/contributors/guide/release-notes.md\r\n-->\r\n```release-note\r\nGenerate
  `metadata.generation` and `status.observedGeneration` fields in HorizontalPodAutoscaler
  resources\r\n```\r\n\r\n#### Additional documentation e.g., KEPs (Kubernetes Enhancement
  Proposals), usage docs, etc.:\r\n\r\n<!--\r\nThis section can be blank if this pull
  request does not require a release note.\r\n\r\nWhen adding links which point to
  resources within git repositories, like\r\nKEPs or supporting documentation, please
  reference a specific commit and avoid\r\nlinking directly to the master branch.
  This ensures that links reference a\r\nspecific point in time, rather than a document
  that may change over time.\r\n\r\nSee here for guidance on getting permanent links
  to files: https://help.github.com/en/articles/getting-permanent-links-to-files\r\n\r\nPlease
