pr_body: "<!--  Thanks for sending a pull request!  Here are some tips for you:\r\n\r\n1.
  If this is your first time, please read our contributor guidelines: https://git.k8s.io/community/contributors/guide/first-contribution.md#your-first-contribution
  and developer guide https://git.k8s.io/community/contributors/devel/development.md#development-guide\r\n2.
  Please label this pull request according to what type of issue you are addressing,
  especially if this is a release targeted pull request. For reference on required
  PR/issue labels, read here:\r\nhttps://git.k8s.io/community/contributors/devel/sig-release/release.md#issuepr-kind-label\r\n3.
  Ensure you have added or ran the appropriate tests for your PR: https://git.k8s.io/community/contributors/devel/sig-testing/testing.md\r\n4.
  If you want *faster* PR reviews, read how: https://git.k8s.io/community/contributors/guide/pull-requests.md#best-practices-for-faster-reviews\r\n5.
  If the PR is unfinished, see how to mark it: https://git.k8s.io/community/contributors/guide/pull-requests.md#marking-unfinished-pull-requests\r\n-->\r\n\r\n####
  What type of PR is this?\r\n\r\n/kind feature\r\nPre-factor for https://github.com/kubernetes/kubernetes/pull/137204,
  https://github.com/kubernetes/kubernetes/pull/137513 and https://github.com/kubernetes/kubernetes/pull/137633\r\n\r\n####
  What this PR does / why we need it:\r\n\r\nAs discussed in https://github.com/kubernetes/kubernetes/pull/137204,
  reviewers preferred to only pass a smaller `authorizer.UnconditionalAuthorizer`
  interface in functions and structs, to restrict what the receiving end can do, in
  other words, only unconditional authorization. If the receiving end wants/needs
  to support conditional authorization, they opt into this by asking for the full
  `authorizer.Authorizer` interface. \r\n\r\nThis PR literally renames all instances
  of:\r\n- `authorizer.Authorizer` -> `authorizer.UnconditionalAuthorizer`\r\n- `initializer.WantsAuthorizer`
  -> `initializer.WantsUnconditionalAuthorizer`\r\n\r\nFinally, the `authorizer.Authorizer`
  interface is added back (when I had verified that the change without it was green,
  so that 100% of references are renamed), in order to never have a commit where it
  would not exist.\r\n\r\nTo keep this change small and contained, the interfaces
  are actually equal to each other right now. More methods are added to `authorizer.Authorizer`
  in https://github.com/kubernetes/kubernetes/pull/137204.\r\n\r\n#### Which issue(s)
  this PR is related to:\r\n<!--\r\nPlease link relevant issues to help with tracking.\r\n\r\nTo
  automatically close the linked issue(s) when this PR is merged,\r\nadd the word
  \"Fixes\" before the issue number or link.\r\nDo not use \"Fixes\" if the PR is
  of kind `failing-test` or `flake`.\r\n\r\nReference KEPs when applicable in addition
  to specific issues.\r\n\r\nExamples:\r\nFixes #<issue number>\r\n<issue link> (issue
  in a different repository)\r\nKEP: https://github.com/kubernetes/enhancements/issues/5681\r\n\r\nIf
  there is no associated issue, then write \"N/A\".\r\n-->\r\n\r\n#### Special notes
  for your reviewer:\r\n\r\n\r\n#### Does this PR introduce a user-facing change?\r\n<!--\r\nIf
  no, just write \"NONE\" in the release-note block below.\r\nIf yes, a release note
  is required:\r\nEnter your extended release note in the block below. If the PR requires
  additional action from users switching to the new release, include the string \"action
  required\".\r\n\r\nFor more information on release notes see: https://git.k8s.io/community/contributors/guide/release-notes.md\r\n-->\r\n```release-note\r\nFunctions
  and structs that take in authorizer.Authorizer might now choose to accept only a
  smaller interface, authorizer.UnconditionalAuthorizer, in case only the receiver
  only needs to perform unconditional authorization requests and wants to signal this
  in the code for clarity. Any authorizer implementation must still implement the
  full authorizer.Authorizer interface.\r\n```\r\n\r\n#### Additional documentation
  e.g., KEPs (Kubernetes Enhancement Proposals), usage docs, etc.:\r\n\r\n<!--\r\nThis
  section can be blank if this pull request does not require a release note.\r\n\r\nWhen
  adding links which point to resources within git repositories, like\r\nKEPs or supporting
  documentation, please reference a specific commit and avoid\r\nlinking directly
  to the master branch. This ensures that links reference a\r\nspecific point in time,
  rather than a document that may change over time.\r\n\r\nSee here for guidance on
  getting permanent links to files: https://help.github.com/en/articles/getting-permanent-links-to-files\r\n\r\nPlease
  use the following format for linking documentation:\r\n- [KEP]: <link>\r\n- [Usage]:
  <link>\r\n- [Other doc]: <link>\r\n-->\r\n```docs\r\n\r\n```\r\n"
releasenote:
  text: Functions and structs that take in `authorizer.Authorizer` might now choose
    to accept only a smaller interface, `authorizer.UnconditionalAuthorizer`, in case
    only the receiver only needs to perform unconditional authorization requests and
    wants to signal this in the code for clarity. Any authorizer implementation must
    still implement the full `authorizer.Authorizer` interface.
